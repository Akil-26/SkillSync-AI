[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "skillsync-ai"
version = "1.0.0"
description = "AI-powered candidate ranking pipeline using semantic embeddings and structured features."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=2.2.0,<4.0.0",
    "numpy>=1.24.0,<3.0.0",
    "torch>=2.0.0,<3.0.0",
    "python-docx>=0.8.11,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<6.0.0",
]

[project.scripts]
skillsync-precompute = "src.precompute:run"
skillsync-rank = "src.rank:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["src*"]
